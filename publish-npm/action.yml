name: 'Publish npm package'
description: >-
  Build and publish a @knockaway npm package to npmjs.org. Publishes a stable
  release (dist-tag `latest`) when invoked from a GitHub Release, and a
  prerelease (dist-tag `beta`, version `<base>-beta.<short-sha>`) otherwise.
branding:
  icon: 'package'
  color: 'purple'

inputs:
  working-directory:
    description: 'Directory containing the package.json to publish (e.g. "sdk").'
    required: false
    default: '.'
  install-directory:
    description: >-
      Directory to run `pnpm install` in. Defaults to working-directory. Set to
      the repo root (".") when the package's build reaches into sibling source
      (e.g. an sdk/ that imports ../src) and therefore needs the parent repo's
      dependencies hydrated.
    required: false
    default: ''
  node-version:
    description: 'Explicit Node version. When empty, node-version-file is used.'
    required: false
    default: ''
  node-version-file:
    description: 'Repo-root file to read the Node version from when node-version is empty.'
    required: false
    default: '.nvmrc'
  npm-token:
    description: >-
      npm automation/granular token with publish rights to the package scope.
      Leave empty to publish via npm **trusted publishing** (OIDC) instead — the
      caller must set `permissions: id-token: write` and a trusted publisher must
      be configured for the package on npmjs.org.
    required: false
    default: ''
  dist-tag:
    description: 'Override the derived dist-tag (latest for releases, beta otherwise).'
    required: false
    default: ''
  version:
    description: 'Override the derived version to publish.'
    required: false
    default: ''
  access:
    description: >-
      Value passed to `pnpm publish --access` (e.g. "public" or "restricted").
      Empty (default) omits the flag so the package keeps its existing access —
      the correct choice for private @knockaway packages. Do NOT set "public"
      for a private package.
    required: false
    default: ''
  provenance:
    description: >-
      When "true", publishes with `--provenance` (Sigstore attestation). Only
      works for PUBLIC packages built in CI with `id-token: write`; leave "false"
      for private packages.
    required: false
    default: 'false'
  pnpm-version:
    description: >-
      Explicit pnpm version for pnpm/action-setup. When empty, the version is
      read from the published package's own package.json `packageManager` field
      (i.e. `<working-directory>/package.json`), so each package controls its own
      pnpm. Set this only to override that.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Configure git identity
      shell: bash
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
        # Read the pnpm version from the package being published, not the repo
        # root — a subpackage (e.g. sdk/) may pin a different pnpm than the service.
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.install-directory != '' && inputs.install-directory || inputs.working-directory }}
      env:
        # Tolerate an install dir that pins a different pnpm than the package
        # being published (e.g. a pnpm-9 service root + a pnpm-10 sdk).
        NPM_CONFIG_PACKAGE_MANAGER_STRICT: 'false'
      run: pnpm install --no-frozen-lockfile

    - name: Build (if a build script exists)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
          echo "Running build…"
          pnpm run build
        else
          echo "No build script found; skipping."
        fi

    - name: Derive version and dist-tag
      id: derive
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        FULL_SHA: ${{ github.sha }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_DIST_TAG: ${{ inputs.dist-tag }}
      run: |
        set -euo pipefail
        base="$(node -p "require('./package.json').version")"

        if [ -n "${INPUT_VERSION}" ]; then
          version="${INPUT_VERSION}"
        elif [ "${EVENT_NAME}" = "release" ]; then
          # GitHub Release tag is the SDK semver; strip an optional leading "v".
          version="${RELEASE_TAG#v}"
        else
          version="${base}-beta.${FULL_SHA:0:7}"
        fi

        if [ -n "${INPUT_DIST_TAG}" ]; then
          tag="${INPUT_DIST_TAG}"
        elif [ "${EVENT_NAME}" = "release" ]; then
          tag="latest"
        else
          tag="beta"
        fi

        if [ -z "${version}" ]; then
          echo "::error::Could not derive a version (event=${EVENT_NAME}, tag=${RELEASE_TAG})."
          exit 1
        fi

        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
        echo "Resolved: version=${version} dist-tag=${tag}"

    - name: Set package version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm version --no-git-tag-version --allow-same-version "${{ steps.derive.outputs.version }}"

    - name: Skip if version already published
      id: existing
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        pkg="$(node -p "require('./package.json').name")"
        version="${{ steps.derive.outputs.version }}"
        if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
          echo "already=true" >> "${GITHUB_OUTPUT}"
          echo "${pkg}@${version} is already published; nothing to do."
        else
          echo "already=false" >> "${GITHUB_OUTPUT}"
        fi

    # Publish. Prefers OIDC trusted publishing when available (caller granted
    # `id-token: write`), and falls back to the npm token when OIDC is
    # unavailable or fails. With a token but no OIDC it publishes via the token;
    # with OIDC but no token it publishes via OIDC only.
    - name: Publish
      if: ${{ steps.existing.outputs.already == 'false' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NPM_TOKEN_INPUT: ${{ inputs.npm-token }}
        ACCESS: ${{ inputs.access }}
        PROVENANCE: ${{ inputs.provenance }}
        TAG: ${{ steps.derive.outputs.tag }}
      run: |
        set -uo pipefail

        publish_oidc() {
          # Trusted publishing: no NODE_AUTH_TOKEN (an empty one blocks the OIDC
          # exchange). npm's OIDC needs >= 11.5.1, newer than Node's bundled CLI.
          echo "→ Publishing via npm trusted publishing (OIDC)…"
          npm install -g npm@latest || return 1
          local args=(--tag "${TAG}")
          [ -n "${ACCESS}" ] && args+=(--access "${ACCESS}")
          npm publish "${args[@]}"
        }

        publish_token() {
          echo "→ Publishing via pnpm + token…"
          local args=(--no-git-checks --tag "${TAG}")
          [ -n "${ACCESS}" ] && args+=(--access "${ACCESS}")
          [ "${PROVENANCE}" = "true" ] && args+=(--provenance)
          NODE_AUTH_TOKEN="${NPM_TOKEN_INPUT}" pnpm publish "${args[@]}"
        }

        oidc=false
        [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && oidc=true

        if [ "${oidc}" = "true" ]; then
          if publish_oidc; then
            exit 0
          elif [ -n "${NPM_TOKEN_INPUT}" ]; then
            echo "::warning::OIDC publish failed; falling back to the npm token."
            publish_token
          else
            echo "::error::OIDC publish failed and no npm-token fallback is set."
            exit 1
          fi
        elif [ -n "${NPM_TOKEN_INPUT}" ]; then
          publish_token
        else
          echo "::error::No auth available: set npm-token, or grant id-token: write for OIDC."
          exit 1
        fi
